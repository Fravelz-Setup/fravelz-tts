[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fravelz-tts"
version = "0.1.0"
description = "Desktop text-to-speech (edge-tts online + Piper offline), Jarvis UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "edge-tts>=6.1",
]

[project.scripts]
fravelz-tts = "fravelz_tts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
